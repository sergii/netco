name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/deploy-request"

permissions:
  contents: read

concurrency:
  group: netco-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Verify before deploy
        run: |
          npm run typecheck
          npx wrangler deploy --dry-run --config wrangler.jsonc

      - name: Deploy Netco Worker
        run: npx wrangler deploy --config wrangler.jsonc
