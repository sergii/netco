name: Apply Map Representation Patch

on:
  push:
    branches:
      - feat/map-representation-levels
    paths:
      - "scripts/apply-map-representation-patch.mjs"
      - ".github/workflows/apply-map-representation-patch.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/map-representation-levels
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI patch
        run: node scripts/apply-map-representation-patch.mjs
      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply-map-representation-patch.mjs
          rm .github/workflows/apply-map-representation-patch.yml
      - name: Commit patched UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(ui): add hierarchical map levels and overlay inspection"
          git push origin HEAD:feat/map-representation-levels
