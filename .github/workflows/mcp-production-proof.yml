name: MCP Production Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netco-production-mcp-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      NETCO_MCP_TOKEN: ${{ secrets.NETCO_MCP_TOKEN }}
      NETCO_BASE_URL: https://netco.web33.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production MCP acceptance credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NETCO_MCP_TOKEN"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate MCP adapter before production proof
        run: node scripts/validate-mcp-adapter.mjs

      - name: Run MCP production proof
        shell: bash
        run: bash scripts/acceptance/mcp-production-proof.sh
