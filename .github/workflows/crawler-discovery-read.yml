name: Crawler Discovery Read Acceptance

on:
  push:
    branches:
      - test/crawler-discovery-read
    paths:
      - ".github/workflows/crawler-discovery-read.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      URL: https://netco.sergii-ponomarov.workers.dev/api/v1/sources/teremki-billing/discovery

    steps:
      - name: Wait for discovery observation
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 48); do
            body="$(curl -fsS "$URL" 2>/dev/null || true)"

            if DISCOVERY_BODY="$body" node -e '
              try {
                const body = JSON.parse(process.env.DISCOVERY_BODY || "{}");
                const discovery = body.discovery;
                if (
                  discovery &&
                  discovery.id &&
                  discovery.source_snapshot_id &&
                  discovery.payload &&
                  typeof discovery.payload.discovered_count === "number"
                ) {
                  console.log(JSON.stringify(body));
                  process.exit(0);
                }
              } catch {}
              process.exit(1);
            '; then
              exit 0
            fi

            echo "Waiting for scheduled discovery (attempt $attempt/48)..."
            sleep 5
          done

          echo "Discovery observation did not appear in time." >&2
          exit 1
