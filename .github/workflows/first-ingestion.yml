name: First Ingestion Acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/first-ingestion.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netco-first-ingestion
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BASE_URL: https://netco.sergii-ponomarov.workers.dev

    steps:
      - name: Wait for production database readiness
        shell: bash
        run: |
          set -euo pipefail

          for attempt in $(seq 1 36); do
            body="$(curl -fsS "$BASE_URL/api/v1/evidence/status" 2>/dev/null || true)"

            if STATUS_BODY="$body" node -e '
              try {
                const body = JSON.parse(process.env.STATUS_BODY || "{}");
                process.exit(
                  body.ready === true &&
                  body.database?.reachable === true &&
                  body.database?.schema_ready === true
                    ? 0
                    : 1
                );
              } catch {
                process.exit(1);
              }
            '; then
              echo "Production Evidence Spine is ready."
              echo "$body"
              exit 0
            fi

            echo "Waiting for production deploy/readiness (attempt $attempt/36)..."
            sleep 5
          done

          echo "Production Evidence Spine did not become ready in time." >&2
          exit 1

      - name: Collect Teremki source
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsS               -X POST               "$BASE_URL/api/v1/sources/teremki/collect"
          )"

          echo "$body"

          COLLECTION_BODY="$body" node -e '
            const body = JSON.parse(process.env.COLLECTION_BODY || "{}");
            if (!["collected", "cooldown"].includes(body.status)) {
              throw new Error("unexpected collection status");
            }
            if (!body.latest_snapshot_id) {
              throw new Error("missing latest snapshot id");
            }
            if (body.status === "collected") {
              if (!body.snapshot?.sha256 || !body.snapshot?.body_ref) {
                throw new Error("missing snapshot evidence");
              }
              if (!body.observation?.id) {
                throw new Error("missing observation");
              }
            }
          '

      - name: Verify provenance
        shell: bash
        run: |
          set -euo pipefail

          body="$(
            curl -fsS               "$BASE_URL/api/v1/sources/teremki/provenance"
          )"

          echo "$body"

          PROVENANCE_BODY="$body" node -e '
            const body = JSON.parse(process.env.PROVENANCE_BODY || "{}");
            if (!body.snapshot?.id || !body.snapshot?.body_ref) {
              throw new Error("snapshot provenance missing");
            }
            if (!body.observation?.id) {
              throw new Error("observation provenance missing");
            }
            if (body.observation.validation_status !== "valid") {
              throw new Error(
                `identity observation is ${body.observation.validation_status}`
              );
            }
            if (!Array.isArray(body.claims) || body.claims.length < 2) {
              throw new Error("expected at least two identity claims");
            }

            console.log(
              `Evidence Spine accepted snapshot ${body.snapshot.id} with ${body.claims.length} claims.`
            );
          '
