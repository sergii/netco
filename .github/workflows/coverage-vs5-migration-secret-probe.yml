name: Coverage VS5 Migration Secret Probe

on:
  push:
    branches:
      - test/coverage-vs5-migration-secrets
    paths:
      - ".github/workflows/coverage-vs5-migration-secret-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    env:
      NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
      POSTGRES_PRISMA_URL: ${{ secrets.POSTGRES_PRISMA_URL }}
      PGHOST: ${{ secrets.PGHOST }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
    steps:
      - name: Report migration credential availability
        shell: bash
        run: |
          set -euo pipefail
          for name in             NEON_API_KEY             DATABASE_URL             NEON_DATABASE_URL             POSTGRES_URL             POSTGRES_PRISMA_URL             PGHOST             PGDATABASE             PGUSER             PGPASSWORD
          do
            if [ -n "${!name:-}" ]; then
              echo "${name}=present"
            else
              echo "${name}=absent"
            fi
          done
