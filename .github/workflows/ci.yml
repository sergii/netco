name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: netco-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Validate MCP thin-adapter invariants
        run: node scripts/validate-mcp-adapter.mjs

      - name: Validate provisioning scripts
        run: bash -n scripts/provision-hyperdrive.sh scripts/rotate-hyperdrive-credentials.sh scripts/migrate-production.sh

      - name: Verify Worker bundle
        run: npx wrangler deploy --dry-run --config wrangler.jsonc
