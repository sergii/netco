name: VS11 Kyiv Open Data Geo Probe

on:
  push:
    branches:
      - test/vs11-kyiv-open-data-geo-probe
    paths:
      - ".github/workflows/vs11-kyiv-open-data-geo-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query one public Kyiv address fixture
        shell: bash
        run: |
          set -euo pipefail

          response="$(curl -fsS --get             --data-urlencode "where=ukrnamef LIKE '%Клавдіївська%' AND addrnumb1 LIKE '40%'"             --data-urlencode "outFields=objectid,globalid,addrcode,buildcode,ukrnamef,addrnumb1,full_addr,full_addr_short,district1"             --data-urlencode "returnGeometry=true"             --data-urlencode "outSR=4326"             --data-urlencode "f=geojson"             "https://gisserver-stage.kyivcity.gov.ua/mayno/rest/services/KYIV_API/%D0%90%D0%B4%D1%80%D0%B5%D1%81%D0%B8/FeatureServer/0/query")"

          RESPONSE="$response" node --input-type=module <<'NODE'
          const body = JSON.parse(process.env.RESPONSE);
          const features = Array.isArray(body.features) ? body.features : [];

          console.log(JSON.stringify({
            type: body.type,
            count: features.length,
            features: features.map((feature) => ({
              id: feature.id ?? null,
              properties: feature.properties,
              geometry: feature.geometry,
            })),
          }, null, 2));
          NODE
