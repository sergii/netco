name: MCP Production Proof

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mcp-production-proof.yml"
      - "scripts/acceptance/mcp-production-proof.sh"

permissions:
  contents: read

concurrency:
  group: netco-production-mcp-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NETCO_BASE_URL: https://netco.sergii-ponomarov.workers.dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require production deploy credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate MCP adapter before production proof
        run: node scripts/validate-mcp-adapter.mjs

      - name: Run MCP production proof
        shell: bash
        run: bash scripts/acceptance/mcp-production-proof.sh
